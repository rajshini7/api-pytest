name: API Automation CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start mock API
        run: |
          npx --yes json-server-auth db.json --port 3000 > server.log 2>&1 &
          echo "Waiting for server..."
          for i in {1..30}; do
            curl -s http://localhost:3000/posts && break
            sleep 1
          done
          curl http://localhost:3000/posts

      - name: Run pytest
        env:
          BASE_URL: http://localhost:3000
        run: pytest -v

      - name: Upload logs if failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
