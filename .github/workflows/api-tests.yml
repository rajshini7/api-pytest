name: API Automation CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Python (CI does NOT use your .venv)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3️⃣ Setup Node.js (for json-server)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      # 4️⃣ Install json-server
      - name: Install json-server
        run: npm install -g json-server

      # 5️⃣ Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 6️⃣ Start local API server (background)
      - name: Start json-server
        run: |
          json-server --watch db.json --port 3000 &

      # 7️⃣ Run pytest
      - name: Run API tests
        env:
          BASE_URL: http://localhost:3000
        run: |
          pytest --cache-clear
          pytest -v

      # 8️⃣ Upload test report
      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: reports/
