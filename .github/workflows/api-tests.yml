name: API Automation CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start mock API server
        run: |
          npx --yes json-server@0.17.4 --watch db.json --port 3000 > server.log 2>&1 &
          echo "Waiting for json-server..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/posts; then
              echo "Server is UP"
              break
            fi
            sleep 1
          done
          curl http://localhost:3000/posts || (cat server.log && exit 1)

      - name: Run pytest
        env:
          BASE_URL: http://localhost:3000
        run: pytest -v

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: server.log
