name: API Automation CI

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 🔥 START JSON-SERVER RELIABLY
      - name: Start json-server
        run: |
          npx json-server db.json --port 3000 --host 0.0.0.0 > json-server.log 2>&1 &
          echo "Waiting for json-server..."
          for i in {1..20}; do
            curl -s http://localhost:3000/posts && echo "Server is UP" && break
            sleep 1
          done
          curl http://localhost:3000/posts

      - name: Run pytest
        env:
          BASE_URL: http://localhost:3000
        run: |
          pytest --cache-clear
          pytest -v

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: reports/

      - name: Upload json-server logs (if failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: json-server-log
          path: json-server.log
